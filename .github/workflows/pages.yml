name: Deploy web app to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main, live-web-mvp, live-proxy-deploy]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and build
        working-directory: web
        env:
          # The hosted SEC proxy this build talks to. A repository *variable*,
          # not a secret: it is a public URL that ships inside a bundle any
          # visitor can read, and storing it as a secret would imply a
          # confidentiality it does not have.
          #
          # Set it at Settings -> Secrets and variables -> Actions -> Variables.
          # Left unset, the build still succeeds and the deployed page says
          # plainly that it has no filing server — which is the truth, and better
          # than silently requesting /api/filings from a static host.
          SEC_TABLES_API_BASE: ${{ vars.SEC_TABLES_API_BASE }}
        run: |
          npm ci
          npm run vendor
          npm run build
      - name: Report what this build points at
        run: |
          if [ -n "${{ vars.SEC_TABLES_API_BASE }}" ]; then
            echo "::notice::Frontend built against proxy ${{ vars.SEC_TABLES_API_BASE }}"
          else
            echo "::warning::SEC_TABLES_API_BASE is unset. The deployed page will render and extract, but cannot fetch filings. Set the repository variable to the hosted proxy URL."
          fi
      - name: Assemble static site
        working-directory: web
        run: |
          mkdir -p _site
          cp app.html _site/index.html
          cp -R dist _site/dist
          cp -R vendor/pyodide _site/pyodide
          cp -R public/py _site/py
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
