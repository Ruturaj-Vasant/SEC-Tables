[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Version is read from src/sec_tables/__init__.py so the two can never drift.
# They already had: the wheel built as 0.1.0 while the package reported 0.3.0.
name = "sec-tables"
dynamic = ["version"]
description = "Find the right table in an SEC filing and turn it into rows, 1994-present."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Ruturaj Tambe" }]
keywords = ["sec", "edgar", "filings", "proxy", "compensation", "ownership", "xbrl"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
  "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = ["lxml>=4.9"]

[project.scripts]
sec-tables = "sec_tables.cli:main"

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
dev = ["pytest>=7", "pandas>=2.0"]

[tool.hatch.version]
path = "src/sec_tables/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sec_tables"]
# The empirical header maps are data the library needs at runtime.
artifacts = ["src/sec_tables/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
